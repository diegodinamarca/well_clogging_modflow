[executables]
modflow = "/home/diego/modflow/modflow6/bin/mf6"
mt3dms = "/home/diego/modflow/modflow6/bin/mf6"

[folders]
modelname_mf= "flow_model"
modelname_mt = 'transport_model'

[grid]
circular_domain = true
ztop = -3
zbot = [-25, -50]
nlay = 2
k_values = [1, 0.5]
laytyp = [0, 0]
vertical_conductivity_percent = 10.0
specific_storage = 0.0001
nrow = 30
ncol = 30
delr = 3
delc = 3
well_refinement_factor = 3
well_refinement_radius = 3 # Same length units as delr and delc

[methods]
conductivity = "avgK"
k_update_method = "lm" #kozeny-carman / exp_decay / lm

[methods_parameters]
lambdak = 0.01
k_linear_slope = 0.01


[sensitivity]
sensitivity_intervals = 4
porcentage_minimum = 50
porcentage_maximum = 150

[time]
# Optional override for single-record outputs, in model time units.
# timestep_duration = 0.1666666667
nper_mf = 1
nper_mt = 1
perlen_mf = [2]
perlen_mt = [2]
nstp_mf = [12]
nstp_mt = [12]
steady_mf = [false]

[hydrology]
recharge = 0
well_location = [[15,15]]
well_pumping_rate = [100]
well_layer = [[1,2]]

[transport]
porosity = 0.3
deposition_rate = 0.01 #rate of particle deposition (slope m of a linear function d = mC)
deposition_threshold = 1 # concentration over which permeability is affected
longitudinal_dispersivity = 3.0
horizontal_transverse_dispersivity = 0.3
vertical_transverse_dispersivity = 0.3
ncomp = 1
initial_concentration = 10.0
initial_aquifer_concentration = 0
initial_source_concentration = 5
source_active_periods = [1] # list length must match nper_mt and nper_mf
observation_row = 10
observation_column = 10
source_row = 10
source_column = 10
bulk_density = 2000.0
distribution_coefficient = 0.000045
decay_rate = 0.0
isothm = 0
ireact = 0
igetsc = 0

[runtime]
random_fields = false
random_concentration_fields = false
heterogeneous_clay = true
add_wells = true
ipakcb = 53
output_file_name = "mt3d_link.ftl"
compact_oc = true
silent = true
report = true
