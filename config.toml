[executables]
modflow = "/home/diego/modflow/modflow6/bin/mf6"
mt3dms = "/home/diego/modflow/modflow6/bin/mf6"

[folders]
modelname_mf= "flow_model"
modelname_mt = 'transport_model'

[grid]
ztop = -3
zbot = [-25, -50]
nlay = 2
k_values = [20.0, 10]
laytyp = [1, 1]
vertical_conductivity_percent = 10.0
specific_storage = 0.0001
nrow = 20
ncol = 20
delr = 10
delc = 10
well_refinement_factor = 2
well_refinement_radius = 10 # Same length units as delr and delc

[methods]
conductivity = "avgK"
k_update_method = "exp_decay" #kozeny-carman / exp_decay

[methods_parameters]
lambdak = 0.01
n = 0.01

[sensitivity]
sensitivity_intervals = 4
porcentage_minimum = 50
porcentage_maximum = 150

[time]
nper_mf = 1
nper_mt = 1
perlen_mf = [365]
perlen_mt = [365]
nstp_mf = [100]
nstp_mt = [100]
steady_mf = [true]

[hydrology]
recharge = 0
well_location = [[10,10]]
well_pumping_rate = [20]
well_layer = [[1,2]]

[transport]
porosity = 0.3
longitudinal_dispersivity = 3.0
horizontal_transverse_dispersivity = 0.3
vertical_transverse_dispersivity = 0.3
ncomp = 1
initial_concentration = 10.0
initial_aquifer_concentration = 0
initial_source_concentration = 5
source_active_periods = [1] # list length must match nper_mt and nper_mf
observation_row = 10
observation_column = 10
source_row = 10
source_column = 10
bulk_density = 2000.0
distribution_coefficient = 0.000045
decay_rate = 0.0
isothm = 0
ireact = 0
igetsc = 0

[runtime]
random_fields = false
random_concentration_fields = false
heterogeneous_clay = true
add_wells = true
ipakcb = 53
output_file_name = "mt3d_link.ftl"
compact_oc = true
silent = true
report = true
