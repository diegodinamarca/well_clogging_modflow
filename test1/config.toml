[executables]
modflow = "/home/diego/modflow/modflow6/bin/mf6"
mt3dms = "/home/diego/modflow/modflow6/bin/mf6"

[folders]
modelname_mf= "flow_model"
modelname_mt = 'transport_model'

[grid]
ztop = -3
zbot = [-25, -50]
nlay = 2
k_values = [20.0, 10]
laytyp = [1, 1]
vertical_conductivity_percent = 10.0
specific_storage = 0.0001
nrow = 20
ncol = 20
delr = 10
delc = 10

[methods]
conductivity = "avgK"

[time]
nper_mf = 2
nper_mt = 2
perlen_mf = [3650, 14600]
perlen_mt = [3650, 14600]
nstp_mf = [200, 100]
nstp_mt = [200, 100]
steady_mf = [true, true]

[hydrology]
recharge = 0.0025
recharge_infiltration_factor = 0.3
sand_lens_percentage = 0.1
well_location = [[10,10]]
well_pumping_rate = [-20]
well_layer = [[1,2]]

[transport]
porosity = 0.3
longitudinal_dispersivity = 3.0
horizontal_transverse_dispersivity = 0.3
vertical_transverse_dispersivity = 0.3
ncomp = 1
initial_concentration = 10.0
initial_sorbed_concentration = 1.0
observation_row = 10
observation_column = 10
source_row = 10
source_column = 10
bulk_density = 2000.0
distribution_coefficient = 0.000045
decay_rate = 0.0
isothm = 0
ireact = 0
igetsc = 0

[runtime]
random_fields = false
random_concentration_fields = false
heterogeneous_clay = true
add_wells = true
ipakcb = 53
output_file_name = "mt3d_link.ftl"
compact_oc = true
silent = true
report = true