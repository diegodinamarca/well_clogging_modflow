[executables]
modflow = "/home/diego/modflow/modflow6/bin/mf6"
mt3dms = "/home/diego/modflow/modflow6/bin/mf6"

[folders]
modelname_mf= "flow_model"
modelname_mt = 'transport_model'

[grid]
circular_domain = true
ztop = 0
zbot = [-25, -50]
nlay = 2
k_values = [1, 0.5]
laytyp = [0, 0]
vertical_conductivity_percent = 10.0
specific_storage = 0.0001
nrow = 30
ncol = 30
delr = 3
delc = 3
well_refinement_factor = 3
well_refinement_radius = 3 # Same length units as delr and delc

[methods]
conductivity = "avgK"
k_update_method = "none" #kozeny-carman / exp_decay / lm / power_law / ravshanov / none

[methods_parameters]
k_exp = 9 #[L³/M] m3kg−1
k_power = 3
k_linear_slope = 0.99
critical_porosity = 0.05
beta = 1.2 #[L³/M] m3kg−1


[time]
# Optional override for single-record outputs, in model time units. (for plotting x axis scale)
# timestep_duration = 0.1666666667
nper_mf = 1
nper_mt = 1
perlen_mf = [1]
perlen_mt = [1]
nstp_mf = [24]
nstp_mt = [24]
steady_mf = [true]

[hydrology]
recharge = 0
well_location = [[15,15]]
well_pumping_rate = [-50]
well_layer = [[1,2]]

[transport]
porosity = 0.3
deposition_rate = 0.06 #rate of particle deposition [1/T]
mobilization_rate = 0.006 #rate of particle mobilization [1/L]
update_rates = false
power_dep_rate = 0.9 # rate of change of deposition rate
power_mob_rate = 0.9 # rate of change of mobilization rate
deposition_threshold = 0.5 # concentration over which permeability is affected
longitudinal_dispersivity = 3.0
horizontal_transverse_dispersivity = 0.3
vertical_transverse_dispersivity = 0.3
ncomp = 1
initial_aquifer_concentration = 0
initial_source_concentration = [5] # list length must match nper_mt and nper_mf

# For use with CNC package
source_row = 10
source_column = 10

# For sorption
bulk_density = 2000.0
distribution_coefficient = 0.0
decay_rate = 0.0
isothm = 0
ireact = 0
igetsc = 0

[runtime]
iterations = 10
random_fields = false
random_concentration_fields = false
ipakcb = 53
output_file_name = "mt3d_link.ftl"
compact_oc = true
silent = true
report = true
